[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "crates/proto/fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/odclcslkrpb5k/jackstay"
publish = false

# Reaches a member only if its manifest says `[lints] workspace = true`; ./check enforces that.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[profile.release]
overflow-checks = true
panic = "unwind"
