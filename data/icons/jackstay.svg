<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Jackstay</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F4060"/>
      <stop offset="1" stop-color="#132B42"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="112" height="112" rx="22"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="url(#sky)"/>

  <g clip-path="url(#tile)">
    <!-- sea -->
    <path d="M0 102 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 V128 H0 Z" fill="#0E2235"/>
    <path d="M0 108 q8 -4 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#2D5679" stroke-width="2"/>

    <!-- ship A (left, higher) -->
    <path d="M6 88 H34 L30 102 H6 Z" fill="#3A5F7D"/>
    <rect x="20" y="30" width="6" height="58" fill="#C3CDD6"/>
    <rect x="17" y="28" width="12" height="5" rx="1.5" fill="#E2E8ED"/>

    <!-- ship B (right, lower) -->
    <path d="M94 92 H122 V102 H98 Z" fill="#3A5F7D"/>
    <rect x="102" y="42" width="6" height="50" fill="#C3CDD6"/>
    <rect x="99" y="40" width="12" height="5" rx="1.5" fill="#E2E8ED"/>
  </g>

  <!-- the jackstay: taut wire with a slight sag -->
  <path d="M23 31 Q64 50 105 43" fill="none" stroke="#EEF2F5" stroke-width="3" stroke-linecap="round"/>

  <!-- traveller block riding the wire -->
  <rect x="57" y="36" width="14" height="10" rx="3" fill="#C9962E"/>
  <circle cx="64" cy="41" r="2.2" fill="#6B4E12"/>
  <line x1="64" y1="46" x2="64" y2="55" stroke="#EEF2F5" stroke-width="2.5"/>

  <!-- the load: a clipboard -->
  <rect x="45" y="58" width="38" height="46" rx="5" fill="#E25B1F"/>
  <rect x="51" y="66" width="26" height="33" rx="2" fill="#F4F2EC"/>
  <path d="M56 75 H72 M56 82 H72 M56 89 H67" stroke="#9AA8B4" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="55" y="53" width="18" height="10" rx="3" fill="#C3CDD6"/>
  <rect x="61" y="55.5" width="6" height="3" rx="1.5" fill="#132B42"/>
</svg>
