[package]
name = "jackstay-ui"
description = "Jackstay's desktop side: the history popup (and, next, the tray and settings)"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jackstay-proto = { path = "../proto", version = "=0.0.0" }
jackstayd = { path = "../jackstayd", version = "=0.0.0" }
gtk = { version = "=0.19.0", features = ["v3_24"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "net", "process"] }
