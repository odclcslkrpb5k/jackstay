[package]
name = "jackstayd"
description = "Jackstay's daemon: the clipboard manager, its history on disk, and its control socket"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jackstay-clip = { path = "../clip", version = "=0.0.0" }
jackstay-selection = { path = "../selection", version = "=0.0.0" }
jackstay-store = { path = "../store", version = "=0.0.0" }
jackstay-x11-clip = { path = "../x11-clip", version = "=0.0.0" }
jackstay-proto = { path = "../proto", version = "=0.0.0" }
signal-hook = { version = "=0.4.5", default-features = false }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "event", "fs", "net", "process"] }

[dev-dependencies]
proptest.workspace = true
