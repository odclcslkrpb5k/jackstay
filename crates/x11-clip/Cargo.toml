[package]
name = "jackstay-x11-clip"
description = "Jackstay's clipboard thread: the selection engine on a real X connection"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jackstay-clip = { path = "../clip", version = "=0.0.0" }
jackstay-selection = { path = "../selection", version = "=0.0.0" }
x11rb = { version = "=0.14.0", default-features = false, features = ["xfixes"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "event", "system"] }

[dev-dependencies]
x11rb = { version = "=0.14.0", default-features = false }
