# Fuzz targets for jackstay-proto (TS-16). Built only by cargo-fuzz, on the pinned nightly; kept out
# of the workspace so the stable gate never needs nightly.
[package]
name = "jackstay-proto-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
jackstay-proto = { path = "..", version = "=0.0.0" }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "control"
path = "fuzz_targets/control.rs"
test = false
doc = false
bench = false

[[bin]]
name = "link"
path = "fuzz_targets/link.rs"
test = false
doc = false
bench = false

[workspace]
