[package]
name = "jackstay-net"
description = "The link between two Jackstay machines: identity, pairing, authenticated QUIC sessions"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jackstay-proto = { path = "../proto", version = "=0.0.0" }
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "=0.11.19", default-features = false, features = ["ring"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "time"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
socket2 = { version = "=0.6.5", default-features = false }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }

[dev-dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "time", "process"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros"] }
