name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Three kinds of job, side by side: the gate; the plants, in four shards (each plant in exactly
# one, by tools/prove-checks --shard); and the fuzzers. Each builds from cold on its own runner.
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./check
  prove-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./dev tools/prove-checks --shard ${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plants-${{ matrix.shard }}
          path: .cache/plants/*.log
          if-no-files-found: ignore
          include-hidden-files: true
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./dev tools/fuzz 60
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/*/fuzz/artifacts/
          if-no-files-found: ignore
